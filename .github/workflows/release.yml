# A release: the Firefox version signed by Mozilla (unlisted) and the Chrome version as a zip, both
# attached to a GitHub release.
#
# Starts when a version tag is pushed (v0.3.2; it must be the version in manifest.json):
#   node version.mjs patch
#   git commit -am "Version 0.3.2" && git tag v0.3.2 && git push origin main v0.3.2
# or by hand: Actions -> Release -> Run workflow (it uses the version in manifest.json).
#
# The AMO key: the repository secrets AMO_API_KEY (the JWT issuer) and AMO_API_SECRET (the JWT secret)
# (Settings -> Secrets and variables -> Actions).

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write  # to create the release

concurrency: release  # one at a time: Mozilla signs each version once

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check the version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./manifest.json').version")
          tag="v$version"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo "::error::The tag $GITHUB_REF_NAME isn't the version in manifest.json ($version). Run: node version.mjs $GITHUB_REF_NAME"
            exit 1
          fi
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "::error::Release $tag exists already. Raise the version first: node version.mjs patch"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Sign the Firefox version (unlisted)
        env:
          AMO_API_KEY: ${{ secrets.AMO_API_KEY }}
          AMO_API_SECRET: ${{ secrets.AMO_API_SECRET }}
          AMO_APPROVAL_TIMEOUT: "2700000"  # wait up to 45 minutes for Mozilla
        run: node sign.mjs

      - name: Build the Chrome version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          node build.mjs chrome
          mkdir -p release
          cp web-ext-artifacts/*.xpi "release/manga-translate-firefox-$VERSION.xpi"
          (cd dist/chrome && zip -qr "../../release/manga-translate-chrome-$VERSION.zip" .)
          ls -l release

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" release/* \
            --title "Manga Translate $VERSION" \
            --target "$GITHUB_SHA" \
            --generate-notes \
            --notes "**Firefox:** open \`manga-translate-firefox-$VERSION.xpi\` in Firefox (signed by Mozilla).
          **Chrome / Edge:** unzip \`manga-translate-chrome-$VERSION.zip\`, then \`chrome://extensions\` → Developer mode → **Load unpacked**."
